name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm run typecheck
      - name: dist/ is up to date
        run: npm run build && git diff --exit-code dist/
      - run: npm test
      - name: npm package works when installed
        run: |
          mkdir -p /tmp/pack && npm pack --pack-destination /tmp/pack
          cd /tmp/pack && npm init -y && npm i --ignore-scripts ./*.tgz
          cd - && DK_SERVER_BIN=/tmp/pack/node_modules/.bin/decisionkit node --test test/server.test.ts test/cli.test.ts
      - name: plugin manifests validate
        run: npx -y @anthropic-ai/claude-code plugin validate --strict . && npx -y @anthropic-ai/claude-code plugin validate --strict .claude-plugin/plugin.json
  node-floor:
    # The bundle must start on the oldest supported Node (engines: >=20).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - name: bundled server answers initialize and status
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"status","arguments":{"ping":false}}}' | (node dist/server.mjs & sleep 2; kill $! 2>/dev/null) | tee out.txt
          grep -q '"id":2' out.txt && ! grep -q 'status failed' out.txt
