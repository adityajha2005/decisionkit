name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: no job here needs write access.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so plugin validation is reproducible; bump deliberately.
  CLAUDE_CODE_VERSION: 2.1.296

jobs:
  check:
    name: Typecheck & bundle freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: dist/ matches src/
        run: |
          npm run build
          git diff --exit-code dist/ || { echo "::error::dist/server.mjs is stale. Run 'npm run build' and commit it."; exit 1; }

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24] # tests run .ts directly (type stripping needs Node ≥ 22)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit, MCP and CLI end-to-end tests (mock providers, no keys)
        run: npm test

  package:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack
        run: mkdir -p "$RUNNER_TEMP/pack" && npm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Tarball contains only the expected files
        run: |
          expected=$'package/LICENSE\npackage/README.md\npackage/dist/server.mjs\npackage/package.json'
          actual=$(tar -tzf "$RUNNER_TEMP"/pack/*.tgz | LC_ALL=C sort)
          [ "$actual" = "$expected" ] || { echo "::error::Unexpected tarball contents:"; echo "$actual"; exit 1; }
      - name: Install the tarball and run end-to-end tests against the installed bin
        run: |
          cd "$RUNNER_TEMP/pack" && npm init -y >/dev/null && npm i --ignore-scripts ./*.tgz
          cd "$GITHUB_WORKSPACE"
          DK_SERVER_BIN="$RUNNER_TEMP/pack/node_modules/.bin/decisionkit" node --test test/server.test.ts test/cli.test.ts

  plugin:
    name: Claude Code plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate marketplace and plugin (strict)
        run: |
          npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate --strict .
          npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate --strict .claude-plugin/plugin.json

  node-floor:
    name: Bundle runs on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22] # engines: >=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: CLI starts
        run: node dist/server.mjs --help | head -1
      - name: MCP server answers initialize and a status call
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"status","arguments":{"ping":false}}}' \
            | (node dist/server.mjs & sleep 2; kill $! 2>/dev/null) > out.jsonl
          grep -q '"id":2' out.jsonl && ! grep -q 'status failed' out.jsonl || { cat out.jsonl; exit 1; }
